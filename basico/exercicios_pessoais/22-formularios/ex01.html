<!DOCTYPE html>

<head>

    <title>Exercício de formulário - 1</title>
    <style>
        input {
            display: block;
            margin-bottom: 10px;

</head>
<body>
    <h1>Meu formluário</h1>
    <form action="cadastro.php" autocomplete="off">
        <label for="iNome">Nome:</label>

        <label for="iPele">Pele:</label>
