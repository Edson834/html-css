<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Max-width e Min-width</title>

    <style>
        * {
            padding: 0;
            margin: 0;
        }

        body {
            height: 90vh;
        }

        h1 {
            font-size: 5vw;
        }

        div {
            max-width: 800px;
            min-width: 300px;
            height: 1000px;
            margin: auto;
            background-color: aqua;
            color: black;
            text-align: center;
            
        }

    </style>
</head>
<body>
    <h1>Testes com a largura mínima e máxima</h1>
    <div>
        <span>Teste</span>
    </div>
</body>
</html>
