<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet" href="estilos/media-queries.css">
</head>
<body>
    <main>
        <section id="sec-imagem"></section>

        <section id="sec-login">
            <h1>Login</h1>
            <p>Seja bem-vindo(a) novamente. Faça login para acessar sua conta e poder fazer as configurações no seu ambiente.</p>
            
            <form action="" method="post">
                <div class="grupo-form">
                    <span class="material-icons">person</span>
                    <input type="email" name="mail" id="imail" class="campo" placeholder="seu e-mail">
                </div>

                <div class="grupo-form">
                    <span class="material-icons">vpn_key</span>
                    <input type="password" name="pass" id="ipass" class="campo" placeholder="sua senha">
                </div>

                <div class="butoes">
                    <input type="submit" value="Entrar">
                    <a href="#">Esqueci a senha <span class="material-icons">mail</span></a>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
