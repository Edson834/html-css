<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .caixa {
            border: 1px solid black;
            border-radius: 10px;
            width: 100px;
            height: 100px;
            margin-bottom: 10px;
        }

        .caixa > p {
            display: none;
            font-size: 2rem;
            text-align: center;
        }

        .caixa:hover > p {
            display: block;
        }

        .um {
            background-color: aqua;
        }

        .um:hover {
            background-color: blueviolet;
        }

        .um:active {
            background-color: brown;
        }


        .dois {
            background-color: blueviolet;
        }

        .dois:hover {
            background-color: brown;
        }

        .dois:active {
            background-color: chartreuse;
        }
        

        .tres {
            background-color: brown;
        }

        .tres:hover {
            background: chartreuse;
        }

        .tres:active {
            background-color: aqua;
        }


        .quatro {
            background-color: chartreuse;
        }

        .quatro:hover {
            background-color: aqua;
        }

        .quatro:active {
            background-color: blueviolet;
        }
    </style>
</head>
<body>
    <h1>Testando pseudo-classes</h1>
    <div class="caixa um">
        <p>A!</p>
    </div>
    <div class="caixa dois"><p>PA!</p></div>
    <div class="caixa tres"><p>RE!</p></div>
    <div class="caixa quatro"><p>CI!</p></div>
</body>
</html>
