<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posicionamento e centralização de caixas</title>

    <style>
        body {
            height: 98vh;
        }

        .caixa {
            border: 1px solid black;
            height: 20vw;
            width: 20vw;
            text-align: center;
        }

        .um {
            position: absolute;
            background-color: aqua;
            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);
        }

        .dois {
            position: absolute;
            background-color: brown;
            top: 100px;
            right: 100px;
        }

        .tres {
            position: absolute;
            background-color: burlywood;
            bottom: 100px;
            right: 100px;
        }

        .quatro {
            position: absolute;
            background-color: chartreuse;
            top: 100px;
            left: 100px;
        }

        .cinco {
            position: absolute;
            background-color: chocolate;
            bottom: 100px;
            left: 100px;
        }
        
    </style>
</head>
<body>
    <h1>Testando o posicionamento geral de caixas</h1>
    
    <div class="caixa um">1</div>
    <div class="caixa dois">2</div>
    <div class="caixa tres">3</div>
    <div class="caixa quatro">4</div>
    <div class="caixa cinco">5</div>
</body>
</html>
