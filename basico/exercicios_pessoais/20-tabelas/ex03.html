<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de tabelas - 3</title>

    <style>
        table {
            width: 600px;
            height: 200px;
            border-collapse: collapse;
        }

        caption {
            font: normal bold 1.5rem verdana, sans-serif;
        }

        thead {
            height: 50px;
        }
        
        
        th, td {
            border: 1px solid black;
        }

          th {
            background-color: gray;
            color: white;
        }
        
        td {
            text-align: center;
        }
        </style>
</head>
<body>
    <table>
        <caption>Tabela com <q>Spans</q> e <q>Scopes</q></caption>
        <thead>
            <tr>
                <th scope="col">Coluna1</th>
                <th colspan="2" scope="colgroup">Coluna2</th>
                <th colspan="2" scope="colgroup">Coluna3</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <th rowspan="2" scope="rowgroup">A</th>
                <td>a</td>
                <td>d</td>
                <td>$</td>
                <td>"</td>
            </tr>

            <tr>
                <td>b</td>
                <td>!</td>
                <td>%</td>
                <td>=</td>
            </tr>
            
            <tr>
                <th rowspan="2" scope="rowgroup">B</th>
                <td>c</td>
                <td>e</td>
                <td>&</td>
                <td>»</td>
            </tr>

            <tr>
                <td>d</td>
                <td>f</td>
                <td>/</td>
                <td>«</td>
            </tr>

            
            
        </tbody>
    </table>
</body>
</html>
