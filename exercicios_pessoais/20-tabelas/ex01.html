<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de tabelas - 1</title>
    <style>
        
        table  {
            border-collapse: collapse;
            width: 400px;
            height: 200px;
            
            
        }

        td, th {
            border: 1px solid black;
            vertical-align: bottom;
            text-align: center;
            
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th>Coluna1</th>
                <th>Coluna2</th>
                <th>Coluna3</th>
                <th>Coluna4</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>1</td>
                <td>2</td>
                <td>3</td>
                <td>4</td>
            </tr>
            <tr>
                <td>5</td>
                <td>6</td>
                <td>7</td>
                <td>8</td>
            </tr>
            <tr>
                <td>9</td>
                <td>10</td>
                <td>11</td>
                <td>12</td>
            </tr>
            
           
    </table>
</body>
</html>
