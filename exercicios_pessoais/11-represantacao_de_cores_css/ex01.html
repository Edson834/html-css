<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        div {
            border: 4px solid black;
            width: 200px;
            height: 200px;
            margin-bottom: 10px;
        }

        /*FORMAS DE REPRESENTAÇÃO DE CORES NO CSS*/


        /* Por nome*/
        div.um {
            background-color: blue;
        }

        /*Por RGB (RED, GREEN, BLUE)*/
        div.dois {
            background-color: rgb(150, 500, 75);
        }

        /*Por HSL (HUE, SATURATION, LIGHTNESS)*/
        div.tres {
            background-color: hsl(84, 10%, 28%);
        }
        
        /*Por personalização utilizando o recurso do VS Code com o cursor*/
        div.quatro {
            background-color: rgba(89, 14, 107, 0.452);
        }
    </style>
</head>
<body>
    <div class="um">

    </div>

    <div class="dois">

    </div>

    <div class="tres">

    </div>

    <div class="quatro">

    </div>
</body>
</html>
