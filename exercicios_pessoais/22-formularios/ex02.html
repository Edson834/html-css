<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de formluário - 2</title>
    <style>
        input {
            display: block;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <h1>Meu formluário</h1>
    <form action="cadastro.php" method="get">
        <label for="iNome">Nome:</label>
        <input required type="text" name="Nome" id="iNome">

        <label for="iData">Data:</label>
        <input type="date" name="Data" id="iData">

        <label for="inota">Nota</label>
        <input required type="number" name="nota" id="inota" step="0.1" min="0" max="20" value="10" placeholder="A nota">
        
        <label for="imes">Mês</label>
        <input type="month" name="mes" id="imes">
        
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </form>
</body>
</html>
