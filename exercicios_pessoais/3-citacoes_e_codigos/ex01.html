<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Citações e Códigos</title>
</head>
<body>
    <h1>Testando texto monoespaçado e pre-formatado</h1>
    <code>
        <p>Este é um exemplo de texto monoespaçado com a tag &lt;code&gt;</p>
    </code>

    <pre>
    
        <p>
            Este
            é
            um exeplo de
            texto pre formatado com a tag
            &lt;pre&gt;
        </p>
    
    </pre>
</body>
</html>
