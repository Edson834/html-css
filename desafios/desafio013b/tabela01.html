<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        table {
            width: 400px;
            border-collapse: collapse;
        }

        td, th {
            border: 1px solid black;
            padding: 10px;
        }

        .special {
            background-color: gray;
            color: white;
            font-weight: bold;
        }

        .set {
            width: 100px;
            height: 0px;
            padding: 0;
            margin: 0;
        }
        
        .main {
            border-bottom: 1px solid black;
            margin: 0;
            padding: 5px;
        }

        .sec {
            height: 100%;
            border-right: 1px solid black;
            padding-right: 4px;
            padding-top: 1px;
            padding-bottom: 1px;
        }


    </style>
</head>
<body>
    <table>
        <thead>
            <tr class="special">
                <th rowspan="2">Área</th>
                <th rowspan="2">Disciplinas</th>
                <th colspan="2" class="set">
                    <p class="main">Notas</p>
                    <span class="sec">Nota 1</span>
                    <span class="other">Nota 2</span>
                </th>
                <th rowspan="2">Média</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <th rowspan="4">Exatas</th>
                <td>Matemática</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>

            <tr>
                <td>Física</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>

            <tr>
                <td>Química</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>

            <tr>
                <td>Biologia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>

            <tr class="special">
                <th colspan="4">Média de Exatas</th>
                <th>0.0</th>
            </tr>

            <tr>
                <th rowspan="2">Humanas</th>
                <td>História</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>

            <tr>
                <td>Geografia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
        </tbody>

        <tfoot>
            <tr class="special">
                <th colspan="4">Média de Humanas</th>
                <th>0.0</th>
            </tr>
        </tfoot>
    </table>
</body>
</html>
