<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>box-shadow</title>

    <style>
        div {
            background: lightcoral;
            width: 400px;
            height: 400px;
            box-shadow: 10px 10px 30px 10px rgba(255, 0, 0, 0.795), 20px 20px 30px 20px rgba(0, 255, 0, 0.795), 30px 30px 30px 30px rgba(0, 0, 255, 0.795);
            margin: auto;
        }
    </style>
</head>

<body>
    <h1>box-shadow</h1>

    <div></div>
</body>

</html>
