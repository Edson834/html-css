<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transition</title>

    <style>
        div {

            --animar: cubic-bezier(.79, -0.21, .24, 1.37);
            background-color: orange;
            width: 200px;
            height: 200px;
            margin: 100px auto;
            /* transition-property: width, height;
            transition-duration: .5s, 1s;
            transition-timing-function: cubic-bezier(.79, -0.21, .24, 1.37); */

            transition: width .5s var(--animar), height 1s var(--animar) .3s, background-color .5s var(--animar);
        }

        div:hover {
            width: 400px;
            height: 400px;
            background-color: red;

        }
    </style>
</head>

<body>
    <div></div>
</body>

</html>
