<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        html {
            font-size: 62.5%;
        }

        header {
            width: 100%;
            height: 15em;
            background-color: rgba(255, 0, 0, 0.267);
            position: fixed;
            top: 0;
        }

        main {
            background: gray;
            min-height: calc(100vh - 15rem - 2rem);
            margin-top: 15rem;
        }

        footer {
            height: 10rem;
            font-size: 2rem;
            background: blue;
        }
    </style>
</head>

<body>
    <header>header</header>
    <main>main</main>
    <footer>footer</footer>
</body>

</html>
