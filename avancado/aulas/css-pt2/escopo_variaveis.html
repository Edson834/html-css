<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escopo de variáveis</title>

    <style>
        :root {
            --color: red;
        }

        .container {
            --color: rgb(202, 202, 29);
        }

        .div1 {
            --color: green;
        }

        p {
            color: var(--color);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="div1">
            <p>Lorem, ipsum dolor.</p>
        </div>
        <div class="div2">
            <p>Lorem, ipsum dolor.</p>
        </div>
    </div>
</body>

</html>
