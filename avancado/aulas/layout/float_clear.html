<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Float e Clear</title>

    <style>
        #container {
            background-color: #ccc;
            overflow: auto;
        }

        #container div {
            background-color: rgba(255, 0, 0, 0.568);
            height: 40px;
            width: 400px;
            margin-bottom: 10px;
        }

        #div1 {
            float: right;
        }

        #div2 {
            float: left;
        }

        #div3 {
            float: right;
        }
    </style>
</head>

<body>
    <div id="container">
        <div id="div1"></div>
        <div id="div2"></div>
        <div id="div3"></div>
    </div>
</body>

</html>
