<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            text-align: left;
            background: lightgray;
        }

        tr {
            border-bottom: 1px solid rgba(128, 128, 128, 0.514);
        }

        tbody tr:nth-child(odd) {
            background-color: rgba(220, 220, 220, 0.349);
        }

        tbody tr:hover {
            background-color: #e9e9e9;
        }

        tbody tr:has(td:first-child input:checked) {
            background-color: rgba(17, 236, 17, 0.322);
        }

        th,
        td {
            padding: 10px;
        }
    </style>
</head>

<body>
    <table>
        <thead>
            <tr>
                <th></th>
                <th>Nome</th>
                <th>Email</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td><input type="checkbox" name="" id=""></td>
                <td>John Doe</td>
                <td>johndoe@example.com</td>
            </tr>
            <tr>
                <td><input type="checkbox" name="" id=""></td>
                <td>Jane Smith</td>
                <td>janesmith@example.com</td>
            </tr>
            <tr>
                <td><input type="checkbox" name="" id=""></td>
                <td>Michael Johnson</td>
                <td>michaeljohnson@example.com</td>
            </tr>
            <tr>
                <td><input type="checkbox" name="" id=""></td>
                <td>Sarah Williams</td>
                <td>sarahwilliams@example.com</td>
            </tr>
            <tr>
                <td><input type="checkbox" name="" id=""></td>
                <td>David Brown</td>
                <td>davidbrown@example.com</td>
            </tr>
        </tbody>
    </table>

    <p></p>
</body>

</html>
