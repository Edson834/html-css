<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accent-color</title>

    <style>
        input {
            accent-color: green;
        }
    </style>
</head>

<body>
    <h1>Accent color</h1>
    <h2>Range</h2>
    <input type="range" name="" id="">

    <h2>Progress</h2>
    <input type="checkbox" name="" id="">HTML
    <input type="checkbox" name="" id="">CSS

    <h2>Radio</h2>
    <span>Tudo bem?</span>
    <input type="radio" name="estado" id="bom">Sim
    <input type="radio" name="estado" checked id="mau">Não
</body>

</html>
