<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <main>
        <form action="#" method="post">
            <fieldset>
                <legend>Cadastre-se</legend>
                <div class="form-group">
                    <label for="iusu">Usuário</label>
                    <input type="text" name="usu" id="iusu">
                </div>

                <div class="form-group">
                    <label for="iemail">Email</label>
                    <input type="text" name="email" id="iemail">
                </div>

                <div class="form-group">
                    <label for="isenha">Senha</label>
                    <input type="password" name="senha" id="isenha">
                </div>
            </fieldset>

            <div class="btns-set">
                <div>
                    <input type="submit" value="CADASTRE-SE">
                </div>

                <p>Já possui um conta? <a href="login.html" class="forgot-pass-link">Login</a></p>
            </div>
        </form>
    </main>
</body>

</html>
