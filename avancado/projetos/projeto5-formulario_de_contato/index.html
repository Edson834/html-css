<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de contato</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <main>
        <form action="#" method="post">
            <fieldset>
                <legend>Formulário de contato</legend>
                <div class="form-group">
                    <label for="inome">Seu nome</label>
                    <input type="text" name="nome" id="inome" required minlength="8" maxlength="45"
                        placeholder="Digite seu nome completo">
                </div>
                <div class="form-group">
                    <label for="iemail">Email</label>
                    <input type="email" name="email" id="iemail" required placeholder="Digite o seu e-mail">
                </div>
                <div class="form-group">
                    <label for="iassunto">Assunto</label>
                    <input type="text" name="assunto" id="iassuton" placeholder="Digite o assunto (opcional)">
                </div>
                <div class="form-group">
                    <label for="imensagem">Mensagem</label>
                    <textarea name="mensagem" id="imensagem" required rows="12" cols="12" minlength="20"
                        placeholder="Digite uma mensagem"></textarea>
                </div>

                <input type="submit" value="Enviar">
            </fieldset>
        </form>
    </main>
</body>

</html>
